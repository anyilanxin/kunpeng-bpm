packages:
  - packages/*
  - packages/*/*
  - examples/*
  # 遗留预构建分发物（勿在新链路引用，见根 AGENTS.md）：其 npm 依赖
  # @kunpeng-js/bpmnlint-plugin-kunpeng-compat 已从 registry 下架（404），
  # 排除出安装图让新机器可装；预构建文件原样保留，消费方自行提供其依赖
  - '!packages/bpmn/linting'

# 统一版本目录（pnpm catalog 协议）：packages/{bpmn,common}/* 家族包从这里取版本。
# 自研组件（@kunpeng-io/bpmn-js、kunpeng-bpmn-moddle）与示例仍用内联版本，不进目录。

# 允许执行安装脚本的依赖（esbuild 平台二进制等）
onlyBuiltDependencies:
  - '@carbon/icons'
  - esbuild
  - inferno

# 版本目录：家族包依赖版本统一锁定
catalog:
  ajv: ^8.20.0
  ajv-errors: ^3.0.0
  uuid: 13.0.0
  semver-compare: ^1.0.0
  semver: ^7.8.5
  preact-markup: ^2.1.1
  json-source-map: ^0.6.1
  modeler-moddle: ^0.2.0
  clsx: ^2.1.1
  bpmnlint-utils: ^1.1.1
  bpmnlint: ^11.14.0
  '@bpmn-io/diagram-js-ui': ^0.2.4
  vue: ^3.5.44

  # bpmn / diagram 生态（npm 提供）
  diagram-js: ^15.28.0
  diagram-js-grid: ^2.1.0
  diagram-js-direct-editing: ^3.6.0
  bpmn-js-color-picker: ^0.7.2
  bpmn-moddle: ^10.3.1
  bpmn-font: ^0.13.0

  # 属性面板运行时依赖
  '@bpmn-io/cm-theme': ^0.2.2
  '@carbon/icons': ^11.90.0
  '@codemirror/autocomplete': ^6.20.3
  '@codemirror/commands': ^6.11.1
  '@codemirror/lang-json': ^6.0.2
  '@codemirror/language': ^6.13.1
  '@codemirror/lint': ^6.9.7
  '@codemirror/state': ^6.7.6
  '@codemirror/view': ^6.43.14
  '@lezer/common': ^1.5.3
  '@lezer/highlight': ^1.2.5
  '@lezer/lr': ^1.4.11
  array-move: ^4.0.0
  classnames: ^2.5.1
  focus-trap: ^8.2.3
  inferno: ~5.6.3
  inferno-create-element: ~5.6.3
  mitt: ^3.0.1
  preact: ^11.0.1

  # 基础工具
  min-dash: ^5.1.0
  min-dom: ^5.3.0
  ids: ^3.0.2
  css.escape: ^1.5.1
  escape-html: ^1.0.3
  selection-ranges: ^4.1.1
  selection-update: ^1.1.1
  tiny-svg: ^4.1.4
  fs-extra: ^11.4.1

  # 构建 / 开发
  typescript: ^5.9.3
  vite: ^8.3.5
  '@vitejs/plugin-vue': ^6.0.10
  vite-plugin-babel: ^1.7.3
  '@babel/core': ^7.29.7
  '@babel/plugin-transform-react-jsx': ^7.29.7
  babel-plugin-inline-react-svg: ^2.0.2
  babel-plugin-module-resolver: ^5.0.3
  replace-in-file: ^9.0.0
  '@lezer/generator': ^1.8.1
  rimraf: ^6.1.3
  turbo: ^2.11.9
