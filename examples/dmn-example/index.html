<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@kunpeng-io/dmn-js 示例</title>
    <style>
      html, body, #app { height: 100%; margin: 0; }
      body { font-family: system-ui, 'PingFang SC', sans-serif; font-size: 13px; }
      .example-shell { display: flex; flex-direction: column; height: 100%; }
      .example-header {
        display: flex; align-items: center; gap: 12px;
        padding: 8px 14px; border-bottom: 1px solid #d4d4d4; background: #fafafa;
      }
      .example-header h1 { font-size: 14px; margin: 0; }
      .example-status { margin-left: auto; font-size: 12px; color: #666; }
      .example-status.ok { color: #1a7f37; }
      .example-status.fail { color: #cf222e; font-weight: 600; }
      .canvas-host { flex: 1; min-height: 0; position: relative; }
      button {
        font: inherit; padding: 4px 10px; cursor: pointer;
        border: 1px solid #d0d7de; border-radius: 4px; background: #f6f8fa;
      }
      button:hover { background: #eef1f4; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
